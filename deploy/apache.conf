<VirtualHost *:${PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%h %l %u %t \"%m %U %H\" %>s %b"
</VirtualHost>
ServerTokens Prod
ServerSignature Off
